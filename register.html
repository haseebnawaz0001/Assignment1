<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bole Machinery - Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="media.html">Media &amp; Specs</a>
        <a href="register.html">Register</a>
    </nav>

    <main>
        <h2>Customer Registration and Machine Quote</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Customer Details</legend>

                <p>
                    <label for="fullname">Full name</label>
                    <input type="text" id="fullname" name="fullname" required minlength="3" maxlength="40">
                </p>
                <p>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="20">
                </p>
                <p>
                    <label for="website">Company website</label>
                    <input type="url" id="website" name="website">
                </p>
            </fieldset>

            <fieldset>
                <legend>Machine Details</legend>

                <p>
                    <label for="series">Machine series</label>
                    <select id="series" name="series" required>
                        <option value="">-- Choose a series --</option>
                        <option value="bl90">BL-90 (900 kN)</option>
                        <option value="bl160" selected>BL-160 (1600 kN)</option>
                        <option value="bl280">BL-280 (2800 kN)</option>
                        <option value="bl450">BL-450 (4500 kN)</option>
                    </select>
                </p>
                <p>
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="50" value="1" required>
                </p>
                <p>
                    <label for="colour">Machine colour</label>
                    <input type="color" id="colour" name="colour" value="#2f6db5">
                </p>
                <p>
                    <label for="delivery">Delivery date</label>
                    <input type="date" id="delivery" name="delivery" min="2026-11-01" max="2027-12-31" required>
                </p>
                <p>
                    <label for="calltime">Best time to call</label>
                    <input type="time" id="calltime" name="calltime" min="09:00" max="17:00">
                </p>
                <p>
                    <label for="drawing">Mould drawing</label>
                    <input type="file" id="drawing" name="drawing">
                </p>
            </fieldset>

            <fieldset>
                <legend>Options</legend>

                <p>Installation service:</p>
                <p>
                    <input type="radio" id="install-yes" name="install" value="yes" checked>
                    <label for="install-yes">Yes</label>
                    <input type="radio" id="install-no" name="install" value="no">
                    <label for="install-no">No</label>
                </p>

                <p>Extras:</p>
                <p>
                    <input type="checkbox" id="training" name="extras" value="training" checked>
                    <label for="training">Operator training</label>
                    <input type="checkbox" id="warranty" name="extras" value="warranty">
                    <label for="warranty">Extended warranty</label>
                </p>

                <p>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" cols="40" maxlength="300"></textarea>
                </p>
            </fieldset>

            <p>
                <input type="submit" value="Register and Send Quote Request">
            </p>
        </form>
    </main>
</body>
</html>
